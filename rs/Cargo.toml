[package]
name = "carboy"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "为 Wine / Proton 应用生成可用的 .desktop"
license = "MIT"
repository = "https://github.com/carboy/carboy"

[[bin]]
name = "carboy"
path = "src/main.rs"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
sha1 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
